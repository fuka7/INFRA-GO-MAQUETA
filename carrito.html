<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito — InfraGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,300&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/carrito.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>

<!-- Placeholder para navbar inyectado -->
<div id="navbar-placeholder"></div>

<!-- ════════════════ CONTENIDO ════════════════ -->
<div class="igc-page">

  <!-- Columna izquierda: items -->
  <div>
    <h1 class="igc-page-title">Carro de Compras</h1>
    <div class="igc-page-items" id="igcPageContainer">
      <!-- renderizado por carrito.js -->
    </div>
  </div>

  <!-- Columna derecha: panel resumen -->
  <div class="igc-page-panel" id="igcPagePanel">
    <div class="igc-panel-title">Resumen del pedido</div>

    <div class="igc-panel-row">
      <span>Subtotal productos</span>
      <strong id="igcPanelSubtotal">$0</strong>
    </div>

    <!-- Widget de despacho -->
    <div class="igc-panel-shipping">
      <div id="igcPanelShipping"></div>
    </div>

    <div class="igc-panel-total">
      <span>Total</span>
      <span class="igc-panel-total-val" id="igcPanelTotal">$0</span>
    </div>
    <div class="igc-panel-iva">Precios no incluyen IVA</div>

    <button class="igc-panel-btn-comprar" onclick="igcCheckout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Solicitar cotización formal
    </button>

    <a class="igc-panel-btn-cotizar" href="/configurador.html" onclick="return igbCotizar(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Crear cotización personalizada
    </a>

    <div class="igc-panel-secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Pago 100% seguro · ISO 27001
    </div>
  </div>

</div>

<div id="footer-placeholder"></div>

<!-- Scripts -->
<script type="module" src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>

<!-- Funciones navbar global -->
<script>
function igbOpenComunas(){
  var overlay = document.getElementById('igbComunasOverlay');
  var modal = document.getElementById('igbComunasModal');
  if(overlay && modal) {
    overlay.classList.add('open');
    modal.classList.add('open');
    document.body.style.overflow='hidden';
  }
}
function igbCloseComunas(){
  var overlay = document.getElementById('igbComunasOverlay');
  var modal = document.getElementById('igbComunasModal');
  if(overlay && modal) {
    overlay.classList.remove('open');
    modal.classList.remove('open');
    document.body.style.overflow='';
  }
}
function igbToggleCats(){
  var cats = document.getElementById('igbCats');
  if(cats) cats.classList.toggle('open');
}
function igbToggleMenu(){
  var btn=document.querySelector('.igb-burger');
  var menu=document.getElementById('igbMobile');
  var ov=document.getElementById('igbOverlay');
  if(!menu) return;
  var open=menu.classList.toggle('open');
  if(btn)btn.classList.toggle('open',open);
  if(ov)ov.classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}
function igbCloseMenu(){
  var btn=document.querySelector('.igb-burger');
  var menu=document.getElementById('igbMobile');
  var ov=document.getElementById('igbOverlay');
  if(menu) menu.classList.remove('open');
  if(ov) ov.classList.remove('open');
  if(btn)btn.classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    igbCloseMenu();
    igbCloseComunas();
  }
});
</script>

<script src="/assets/js/navbar-inline.js"></script>
<script src="/assets/js/footer-inline.js"></script>
<script src="/assets/js/shipping.js"></script>
<script src="/assets/js/carrito.js"></script>
</body>
</html>
